[build-system]
requires = ["flit-core >= 3.2, <4"]
build-backend = "flit_core.buildapi"

[project]
name = "dorn"
version = "1.12.1"
description = "GUI for calculating close contact restrictions for radionuclide therapy patients"
authors = [
    { name = "Jake Forster" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "glowgreen",
    "matplotlib",
    "numpy",
    "pandas",
    "platformdirs",
    "python-docx",
    "scipy",
    "xmltodict"
]
classifiers = [
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.gui-scripts]
dorn = "dorn.cli:main"

[project.optional-dependencies]
windows = ["pywin32"]
freeze = ["cx_Freeze"]

[project.urls]
Homepage = "https://github.com/SAMI-Medical-Physics/dorn"
Issues = "https://github.com/SAMI-Medical-Physics/dorn/issues"
Changelog = "https://github.com/SAMI-Medical-Physics/dorn/blob/main/CHANGELOG.md"
